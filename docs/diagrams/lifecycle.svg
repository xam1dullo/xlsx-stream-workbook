<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
      <title id="lifecycle-title">One workbook, five states, one trap</title>
      <desc id="lifecycle-desc">A workbook starts empty, becomes open once a sheet has been written to an intermediate file, moves to saving when save is called, becomes merged when the output is written, and either returns to open or becomes sealed. Sealed is terminal: further calls throw.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Bands: progress rail and the guard-dependent return lane. -->
      <rect x="44" y="112" width="912" height="112" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="52" y="116" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="78" y="125" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROGRESS</text>

      <rect x="236" y="232" width="496" height="56" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="244" y="236" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="266" y="245" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RETURN</text>

      <!-- Terminal marker for the sealed state. -->
      <rect x="836" y="116" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="864" y="125" fill="#eb6c36" fill-opacity="0.75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TERMINAL</text>

      <!-- Transitions. Guard-dependent paths are dashed and route clear of every box. -->
      <line x1="38" y1="172" x2="60" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="172" y1="172" x2="252" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="364" y1="172" x2="444" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="556" y1="172" x2="636" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="748" y1="172" x2="828" y2="172" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="940" y1="172" x2="958" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 692 204 L 692 264 Q 692 272 684 272 L 316 272 Q 308 272 308 264 L 308 204"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 308 140 L 308 96 Q 308 88 316 88 L 876 88 Q 884 88 884 96 L 884 140"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Transition labels: every mask clears its own stroke by 6-10px. -->
      <rect x="188" y="150" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">addSheet</text>

      <rect x="389" y="150" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">save</text>

      <rect x="577" y="150" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="601" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">merge ok</text>

      <rect x="750" y="150" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="788" y="159" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">cleanupOnSave</text>

      <rect x="472" y="254" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">!cleanupOnSave</text>

      <rect x="568" y="68" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="77" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">cleanup</text>

      <!-- Start: filled ink dot. End: ringed dot. -->
      <circle cx="32" cy="172" r="6" fill="#2d3142"/>
      <circle cx="964" cy="172" r="8" fill="none" stroke="#2d3142" stroke-width="1.4"/>
      <circle cx="964" cy="172" r="5" fill="#2d3142"/>

      <!-- new -->
      <rect x="60" y="140" width="112" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="60" y="140" width="112" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="116" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">new</text>
      <text x="116" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no sheets yet</text>

      <!-- open -->
      <rect x="252" y="140" width="112" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="252" y="140" width="112" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="308" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">open</text>
      <text x="308" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">files on disk</text>

      <!-- saving -->
      <rect x="444" y="140" width="112" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="444" y="140" width="112" height="64" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">saving</text>
      <text x="500" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merging</text>

      <!-- merged -->
      <rect x="636" y="140" width="112" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="636" y="140" width="112" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="692" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">merged</text>
      <text x="692" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">output written</text>

      <!-- sealed — the state the reader should notice -->
      <rect x="828" y="140" width="112" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="828" y="140" width="112" height="64" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="884" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sealed</text>
      <text x="884" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every call throws</text>

      <!-- Annotations: what the diagram should not try to draw. -->
      <text x="40" y="316" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">a failed add discards its own file and records nothing</text>
      <path d="M 240 310 Q 300 300 340 214" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="340" cy="214" r="2" fill="#2d3142"/>

      <text x="960" y="316" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">to save twice, opt out before the first save</text>
      <path d="M 900 310 Q 900 260 884 210" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="884" cy="210" r="2" fill="#4f5d75"/>

      <!-- Legend -->
      <line x1="30" y1="332" x2="970" y2="332" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="30" y="350" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="347" x2="140" y2="347" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="150" y="350" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Transition from a call you make</text>

      <line x1="392" y1="347" x2="412" y2="347" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="422" y="350" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Guard-dependent path</text>

      <rect x="620" y="342" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="644" y="350" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The state to notice</text>
    </svg>
