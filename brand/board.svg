<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">xlsx-stream-workbook brand system</title>
  <desc id="board-desc">A nine-panel identity board on a near-black canvas: the logo, its geometric construction, a terminal application, the brand promise, the colour system, typography, a printed card, an image direction panel, and a system detail panel.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .lbl  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: 0.16em; fill: rgba(247,246,243,0.38); }
      .cap  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: rgba(247,246,243,0.55); }
      .val  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: rgba(247,246,243,0.34); }
      .num  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: rgba(247,246,243,0.22); }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#111318"/>
  <rect x="49" y="98" width="490" height="324" rx="4" fill="#171a20"/>
  <rect x="555" y="98" width="490" height="324" rx="4" fill="#171a20"/>
  <rect x="1061" y="98" width="490" height="324" rx="4" fill="#171a20"/>
  <rect x="49" y="438" width="490" height="324" rx="4" fill="#171a20"/>
  <rect x="555" y="438" width="490" height="324" rx="4" fill="#171a20"/>
  <rect x="1061" y="438" width="490" height="324" rx="4" fill="#171a20"/>
  <rect x="49" y="778" width="490" height="324" rx="4" fill="#171a20"/>
  <rect x="555" y="778" width="490" height="324" rx="4" fill="#171a20"/>
  <rect x="1061" y="778" width="490" height="324" rx="4" fill="#171a20"/>

  <text x="49" y="52" class="mono" font-size="11" letter-spacing="0.18em" fill="rgba(247,246,243,0.40)">XLSX-STREAM-WORKBOOK</text>
  <text x="1551" y="52" class="mono" font-size="11" letter-spacing="0.18em" fill="rgba(247,246,243,0.22)" text-anchor="end">IDENTITY SYSTEM · v1.0</text>

  <g id="p1">
    <text x="73" y="126" class="lbl">01 — MARK</text>
    <g transform="translate(224,168) scale(2.2)">
      <g fill="none" stroke="#f7f6f3" stroke-width="2.5">
        <path d="M 10 10 H 54"/><path d="M 10 54 H 54"/>
        <path d="M 10 10 V 28 M 10 36 V 54"/><path d="M 54 10 V 28 M 54 36 V 54"/>
      </g>
      <rect x="2" y="28" width="60" height="8" fill="#c2410c"/>
    </g>
    <text x="294" y="374" class="sans" font-size="22" font-weight="600" fill="#f7f6f3" text-anchor="middle" letter-spacing="-0.02em">xlsx-stream-workbook</text>
    <text x="294" y="122" class="num" text-anchor="end">01</text>
  </g>

  <g id="p2">
    <text x="579" y="126" class="lbl">02 — CONSTRUCTION</text>
    <g transform="translate(624,158) scale(2.5)">
      <g stroke="rgba(247,246,243,0.14)" stroke-width="0.4">
        <path d="M 0 0 H 64 M 0 16 H 64 M 0 32 H 64 M 0 48 H 64 M 0 64 H 64"/>
        <path d="M 0 0 V 64 M 16 0 V 64 M 32 0 V 64 M 48 0 V 64 M 64 0 V 64"/>
      </g>
      <g fill="none" stroke="#f7f6f3" stroke-width="2.5">
        <path d="M 10 10 H 54"/><path d="M 10 54 H 54"/>
        <path d="M 10 10 V 28 M 10 36 V 54"/><path d="M 54 10 V 28 M 54 36 V 54"/>
      </g>
      <rect x="2" y="28" width="60" height="8" fill="#c2410c"/>
      <g stroke="rgba(194,65,12,0.8)" stroke-width="0.4">
        <path d="M -4 10 H 58"/><path d="M -4 54 H 58"/><path d="M 10 -4 V 68"/><path d="M 54 -4 V 68"/>
        <path d="M -6 28 H 64" stroke-dasharray="2,3"/>
      </g>
    </g>
    <text x="812" y="180" class="val">inset 10</text>
    <text x="812" y="208" class="val">stroke 2.5</text>
    <text x="812" y="236" class="val">bar 8</text>
    <text x="812" y="264" class="val">extend 8</text>
    <text x="812" y="292" class="val">grid 16</text>
    <text x="579" y="352" class="cap">one frame, one bar. the bar replaces the edge</text>
    <text x="579" y="372" class="cap">exactly, and extends 8 past it on each side.</text>
    <text x="1019" y="122" class="num" text-anchor="end">02</text>
  </g>

  <g id="p3">
    <text x="1085" y="126" class="lbl">03 — APPLICATION</text>
    <rect x="1085" y="152" width="442" height="246" rx="6" fill="#0d0f13" stroke="rgba(247,246,243,0.10)"/>
    <rect x="1085" y="152" width="442" height="28" rx="6" fill="#14171c"/>
    <rect x="1085" y="174" width="442" height="6" fill="#14171c"/>
    <circle cx="1103" cy="166" r="4" fill="rgba(247,246,243,0.18)"/>
    <circle cx="1117" cy="166" r="4" fill="rgba(247,246,243,0.18)"/>
    <circle cx="1131" cy="166" r="4" fill="rgba(247,246,243,0.18)"/>
    <text x="1150" y="170" class="mono" font-size="10" fill="rgba(247,246,243,0.30)">~/report/export</text>
    <text x="1103" y="212" class="mono" font-size="12"><tspan fill="#c2410c">$</tspan><tspan fill="rgba(247,246,243,0.80)"> npm i xlsx-stream-workbook</tspan></text>
    <text x="1103" y="244" class="mono" font-size="12" fill="rgba(247,246,243,0.55)">const wb = new StreamingWorkbook();</text>
    <text x="1103" y="266" class="mono" font-size="12" fill="rgba(247,246,243,0.55)">await wb.addSheet('Rows', headers, source);</text>
    <text x="1103" y="288" class="mono" font-size="12" fill="rgba(247,246,243,0.55)">await wb.save('report.xlsx');</text>
    <text x="1103" y="326" class="mono" font-size="12" fill="rgba(247,246,243,0.30)">report.xlsx  ·  1.2 MB  ·  1 sheet  ·  ok</text>
    <text x="1103" y="368" class="mono" font-size="11" fill="rgba(194,65,12,0.90)">the file appears; the rows do not accumulate</text>
    <text x="1525" y="122" class="num" text-anchor="end">03</text>
  </g>

  <g id="p4">
    <text x="73" y="466" class="lbl">04 — PROMISE</text>
    <text x="73" y="566" class="sans" font-size="46" font-weight="600" fill="#f7f6f3" letter-spacing="-0.03em">Rows pass through.</text>
    <text x="73" y="618" class="sans" font-size="46" font-weight="600" fill="#c2410c" letter-spacing="-0.03em">Nothing accumulates.</text>
    <rect x="73" y="668" width="120" height="2" fill="#c2410c"/>
    <text x="73" y="722" class="cap">every other writer holds the whole workbook. this one does not.</text>
    <text x="513" y="462" class="num" text-anchor="end">04</text>
  </g>

  <g id="p5">
    <text x="579" y="466" class="lbl">05 — COLOUR</text>
    <g>
      <rect x="579" y="492" width="138" height="118" rx="4" fill="#111318" stroke="rgba(247,246,243,0.12)"/>
      <text x="595" y="628" class="val">ink #111318</text>
      <rect x="733" y="492" width="138" height="118" rx="4" fill="#f7f6f3"/>
      <text x="749" y="628" class="val">paper #f7f6f3</text>
      <rect x="887" y="492" width="138" height="118" rx="4" fill="#c2410c"/>
      <text x="903" y="628" class="val">accent #c2410c</text>
    </g>
    <text x="579" y="666" class="cap">one accent, and it repeats in every panel</text>
    <text x="579" y="686" class="cap">meaning the same thing each time.</text>
    <text x="579" y="716" class="val">#e0662a on dark · rgba(17,19,24,0.12) rules</text>
    <text x="1019" y="462" class="num" text-anchor="end">05</text>
  </g>

  <g id="p6">
    <text x="1085" y="466" class="lbl">06 — TYPE</text>
    <text x="1085" y="580" class="sans" font-size="104" font-weight="600" fill="#f7f6f3" letter-spacing="-0.04em">Aa</text>
    <text x="1240" y="524" class="sans" font-size="19" font-weight="600" fill="#f7f6f3">System sans · 600</text>
    <text x="1240" y="548" class="val">wordmark · one weight · sentence case</text>
    <text x="1240" y="590" class="mono" font-size="13" fill="#c2410c">ui-monospace 12px</text>
    <text x="1240" y="614" class="val">labels · commands · file names</text>
    <text x="1085" y="700" class="cap">two families. a third would be one too</text>
    <text x="1085" y="720" class="cap">many on a board this size.</text>
    <text x="1525" y="462" class="num" text-anchor="end">06</text>
  </g>

  <g id="p7">
    <text x="73" y="836" class="lbl">07 — PRINT</text>
    <rect x="73" y="856" width="288" height="176" rx="4" fill="#f7f6f3"/>
    <g transform="translate(151,876) scale(1.3)">
      <g fill="none" stroke="#111318" stroke-width="2.5">
        <path d="M 10 10 H 54"/><path d="M 10 54 H 54"/>
        <path d="M 10 10 V 28 M 10 36 V 54"/><path d="M 54 10 V 28 M 54 36 V 54"/>
      </g>
      <rect x="2" y="28" width="60" height="8" fill="#c2410c"/>
    </g>
    <text x="217" y="982" class="sans" font-size="14" font-weight="600" fill="#111318" text-anchor="middle">xlsx-stream-workbook</text>
    <text x="217" y="1002" class="mono" font-size="9" fill="#6b7280" text-anchor="middle">MIT · node &gt;= 18</text>
    <rect x="187" y="1012" width="60" height="1" fill="#c2410c"/>
    <text x="73" y="1062" class="cap">card, sticker, slide footer. the mark</text>
    <text x="73" y="1082" class="cap">survives at 16px, so it survives anywhere.</text>
    <text x="513" y="802" class="num" text-anchor="end">07</text>
  </g>

  <g id="p8">
    <text x="579" y="806" class="lbl">08 — DIRECTION</text>
    <rect x="579" y="836" width="466" height="176" rx="4" fill="#0d0f13"/>
    <g>
      <rect x="601" y="856" width="6" height="144" fill="rgba(247,246,243,0.10)"/>
      <rect x="619" y="856" width="6" height="144" fill="rgba(247,246,243,0.14)"/>
      <rect x="637" y="856" width="6" height="144" fill="rgba(247,246,243,0.20)"/>
      <rect x="655" y="856" width="6" height="144" fill="rgba(247,246,243,0.13)"/>
      <rect x="673" y="856" width="6" height="144" fill="rgba(247,246,243,0.26)"/>
      <rect x="691" y="856" width="6" height="144" fill="rgba(247,246,243,0.16)"/>
      <rect x="709" y="856" width="6" height="144" fill="rgba(247,246,243,0.09)"/>
      <rect x="727" y="856" width="6" height="144" fill="rgba(247,246,243,0.22)"/>
      <rect x="745" y="856" width="6" height="144" fill="rgba(247,246,243,0.12)"/>
      <rect x="763" y="856" width="6" height="144" fill="rgba(247,246,243,0.18)"/>
      <rect x="781" y="856" width="6" height="144" fill="rgba(247,246,243,0.11)"/>
      <rect x="799" y="856" width="6" height="144" fill="rgba(247,246,243,0.24)"/>
      <rect x="817" y="856" width="6" height="144" fill="rgba(247,246,243,0.15)"/>
      <rect x="835" y="856" width="6" height="144" fill="rgba(247,246,243,0.08)"/>
      <rect x="853" y="856" width="6" height="144" fill="rgba(247,246,243,0.19)"/>
      <rect x="871" y="856" width="6" height="144" fill="rgba(247,246,243,0.12)"/>
      <rect x="889" y="856" width="6" height="144" fill="rgba(247,246,243,0.25)"/>
      <rect x="907" y="856" width="6" height="144" fill="rgba(247,246,243,0.14)"/>
      <rect x="925" y="856" width="6" height="144" fill="rgba(247,246,243,0.10)"/>
      <rect x="943" y="856" width="6" height="144" fill="rgba(247,246,243,0.21)"/>
      <rect x="961" y="856" width="6" height="144" fill="rgba(247,246,243,0.16)"/>
      <rect x="979" y="856" width="6" height="144" fill="rgba(247,246,243,0.09)"/>
      <rect x="997" y="856" width="6" height="144" fill="rgba(247,246,243,0.17)"/>
      <rect x="579" y="922" width="466" height="8" fill="#c2410c"/>
    </g>
    <text x="579" y="1062" class="cap">a field, and one bar through it. the image</text>
    <text x="579" y="1082" class="cap">direction is the metaphor, not decoration.</text>
    <text x="1019" y="802" class="num" text-anchor="end">08</text>
  </g>

  <g id="p9">
    <text x="1085" y="806" class="lbl">09 — SYSTEM</text>
    <rect x="1085" y="836" width="442" height="40" rx="4" fill="#0d0f13" stroke="rgba(247,246,243,0.10)"/>
    <text x="1101" y="861" class="mono" font-size="11" fill="rgba(247,246,243,0.62)">lib/StreamingWorkbook.js</text>
    <text x="1487" y="861" class="mono" font-size="10" fill="rgba(194,65,12,0.90)" text-anchor="end">276</text>
    <rect x="1085" y="886" width="442" height="40" rx="4" fill="#0d0f13" stroke="rgba(247,246,243,0.10)"/>
    <text x="1101" y="911" class="mono" font-size="11" fill="rgba(247,246,243,0.62)">lib/archive.js</text>
    <text x="1487" y="911" class="mono" font-size="10" fill="rgba(247,246,243,0.34)" text-anchor="end">184</text>
    <rect x="1085" y="936" width="442" height="40" rx="4" fill="#0d0f13" stroke="rgba(247,246,243,0.10)"/>
    <text x="1101" y="961" class="mono" font-size="11" fill="rgba(247,246,243,0.62)">lib/sheet-writer.js</text>
    <text x="1487" y="961" class="mono" font-size="10" fill="rgba(247,246,243,0.34)" text-anchor="end">206</text>
    <g>
      <rect x="1085" y="996" width="86" height="24" rx="12" fill="rgba(194,65,12,0.16)" stroke="rgba(194,65,12,0.55)"/>
      <text x="1128" y="1012" class="mono" font-size="10" fill="#e0662a" text-anchor="middle">streamed</text>
      <rect x="1181" y="996" width="86" height="24" rx="12" fill="rgba(247,246,243,0.06)" stroke="rgba(247,246,243,0.18)"/>
      <text x="1224" y="1012" class="mono" font-size="10" fill="rgba(247,246,243,0.58)" text-anchor="middle">typed</text>
      <rect x="1277" y="996" width="86" height="24" rx="12" fill="rgba(247,246,243,0.06)" stroke="rgba(247,246,243,0.18)"/>
      <text x="1320" y="1012" class="mono" font-size="10" fill="rgba(247,246,243,0.58)" text-anchor="middle">tested</text>
      <rect x="1373" y="996" width="86" height="24" rx="12" fill="rgba(247,246,243,0.06)" stroke="rgba(247,246,243,0.18)"/>
      <text x="1416" y="1012" class="mono" font-size="10" fill="rgba(247,246,243,0.58)" text-anchor="middle">spec'd</text>
    </g>
    <text x="1085" y="1062" class="cap">the accent marks the one thing that</text>
    <text x="1085" y="1082" class="cap">differentiates. everything else stays neutral.</text>
    <text x="1525" y="802" class="num" text-anchor="end">09</text>
  </g>

  <text x="49" y="1150" class="mono" font-size="10" letter-spacing="0.16em" fill="rgba(247,246,243,0.22)">ROWS PASS THROUGH · NOTHING ACCUMULATES</text>
  <text x="1551" y="1150" class="num" text-anchor="end">MIT · NODE &gt;= 18 · TYPES INCLUDED</text>
</svg>
