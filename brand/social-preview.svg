<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">xlsx-stream-workbook</title>
  <desc id="sp-desc">A dark card showing the xlsx-stream-workbook mark and name, with the tagline rows pass through, nothing accumulates, and a strip of the archive parts a produced workbook contains.</desc>

  <rect width="1280" height="640" fill="#111318"/>
  <rect x="0" y="0" width="1280" height="3" fill="#c2410c"/>

  <g transform="translate(120,196) scale(3.2)">
    <g fill="none" stroke="#f7f6f3" stroke-width="2.5">
      <path d="M 10 10 H 54"/><path d="M 10 54 H 54"/>
      <path d="M 10 10 V 28 M 10 36 V 54"/><path d="M 54 10 V 28 M 54 36 V 54"/>
    </g>
    <rect x="2" y="28" width="60" height="8" fill="#c2410c"/>
  </g>

  <text x="120" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="600" fill="#f7f6f3" letter-spacing="-0.03em">xlsx-stream-workbook</text>
  <text x="120" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#c2410c">rows pass through · nothing accumulates</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(247,246,243,0.34)">
    <text x="120" y="586">MIT · node &gt;= 18 · types included · 2 runtime deps</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="rgba(247,246,243,0.22)" text-anchor="end">
    <text x="1160" y="586">jszip + xlsx-write-stream, both upstream</text>
  </g>

  <g opacity="0.5">
    <rect x="880" y="120" width="280" height="1" fill="rgba(247,246,243,0.12)"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="rgba(247,246,243,0.30)">
      <text x="880" y="152">xl/workbook.xml</text>
      <text x="880" y="180">xl/_rels/workbook.xml.rels</text>
      <text x="880" y="208">xl/worksheets/sheet1..N.xml</text>
      <text x="880" y="236">xl/styles.xml</text>
      <text x="880" y="264">[Content_Types].xml</text>
      <text x="880" y="292">_rels/.rels</text>
    </g>
    <text x="880" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="rgba(194,65,12,0.85)">six kinds of part. the whole format.</text>
  </g>
</svg>
