    <path d="M 54 10 V 28 M 54 36 V 54"/>
  </g>
  <rect x="2" y="28" width="60" height="8" fill="#e0662a"/>

  <text x="88" y="46" fill="#f7f6f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="-0.02em">xlsx-stream-workbook</text>
  <text x="88" y="70" fill="#e0662a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">rows pass through, nothing accumulates</text>
