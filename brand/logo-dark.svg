<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" width="480" height="96" role="img" aria-labelledby="logo-dark-title logo-dark-desc">
  <title id="logo-dark-title">xlsx-stream-workbook, reversed</title>
